services:
  postgres:
    image: postgres:17.11-bookworm
    container_name: postgres
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - prefectdb:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: prefect
      POSTGRES_USERNAME: ${POSTGRES_USERNAME}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    restart: always

volumes:
  prefectdb:
