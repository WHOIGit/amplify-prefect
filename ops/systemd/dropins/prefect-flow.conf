# Drop-in for the prefect_* flow-serving units, installed by ops/systemd/install.sh.
[Unit]
After=network-online.target docker.service prefect_server.service
Wants=network-online.target docker.service prefect_server.service
# Never give up restarting.
StartLimitIntervalSec=0

[Service]
Restart=always
RestartSec=30
