# Drop-in for prefect_server.service, installed by ops/systemd/install.sh.
[Unit]
After=network-online.target docker.service prefect_postgres.service
Wants=network-online.target prefect_postgres.service
# Never give up restarting.
StartLimitIntervalSec=0

[Service]
Restart=always
# Postgres can take a few seconds to accept connections after boot.
RestartSec=10
