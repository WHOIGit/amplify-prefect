# Serves the watchdog's status page at /prefect-status/.
# Install (needs root) into the vhost that proxies Prefect, then reload Apache.
RedirectMatch ^/prefect-status$ /prefect-status/
Alias /prefect-status/ /opt/amplify-prefect/ops/watchdog/www/
<Directory /opt/amplify-prefect/ops/watchdog/www/>
    Options None
    AllowOverride None
    Require all granted
    Header set Cache-Control "no-cache"
</Directory>
