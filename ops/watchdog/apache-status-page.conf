# Serves the watchdog's status page at /prefect-status/.
# Install (needs root) into the vhost that proxies Prefect, with the repo's real
# path in place of /path/to/amplify-prefect, then reload Apache.
RedirectMatch ^/prefect-status$ /prefect-status/
Alias /prefect-status/ /path/to/amplify-prefect/ops/watchdog/www/
<Directory /path/to/amplify-prefect/ops/watchdog/www/>
    Options None
    AllowOverride None
    Require all granted
    Header set Cache-Control "no-cache"
</Directory>
